name: Release

# Normally triggered by release-please (see release-please.yml) when its
# release PR is merged. A tag can also be pushed by hand:
#   git tag v0.5.1 && git push origin v0.5.1
# Or run it from the Actions tab for an existing tag, e.g. to republish npm
# packages without touching the GitHub release (github_release: false).
# Tags with a pre-release suffix (v0.6.0-rc.1) become GitHub pre-releases and
# are published to npm under the "next" dist-tag instead of "latest".
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The release tag to build, e.g. v0.6.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.5.1
        required: true
        type: string
      github_release:
        description: Also create/update the GitHub release (off = npm only)
        type: boolean
        default: false

permissions:
  contents: write # create or upload to the GitHub release
  id-token: write # npm trusted publishing (OIDC): no npm token is stored

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PRIVATE_REPO: ${{ github.event.repository.private }}
      # Manual runs publish npm only unless asked; tag pushes and
      # release-please always publish the GitHub release too.
      GITHUB_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.github_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # git describe stamps the tag into the binaries

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Check the tag is a semver version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - name: Format, vet and test
        run: task check

      - name: Lint
        run: task lint

      - name: Vulnerability scan
        run: task vuln

      # No registry-url: that writes an .npmrc with a placeholder token, which
      # npm falls back to when trusted publishing fails, hiding the real error.
      - uses: actions/setup-node@v7 # MCP bundle hooks + npm publishing
        with:
          node-version: 24

      # Builds every platform, packs an MCP bundle per platform, writes
      # SHA256SUMS.txt and publishes the GitHub release. If release-please
      # already created the release, its notes are kept and assets are added.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: ${{ env.GITHUB_RELEASE == 'true' && 'release --clean' || 'release --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      - name: Build npm packages
        run: node npm/build.mjs --version "${TAG#v}"

      - name: Prepare npm trusted publishing
        if: env.PRIVATE_REPO != 'true'
        run: |
          npm install -g npm@latest # 11.5.1+ is required for trusted publishing
          echo "npm $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::This job has no id-token permission, so npm trusted publishing cannot work. Grant id-token: write here and in the calling job."
            exit 1
          fi

      # Trusted publishing: npm checks this run's GitHub identity (OIDC)
      # against the publishers configured on each package (release-please.yml
      # and release.yml). No npm token exists anywhere.
      - name: Publish to npm
        if: env.PRIVATE_REPO != 'true'
        run: bash npm/publish.sh

      - name: npm publishing skipped
        if: env.PRIVATE_REPO == 'true'
        run: echo "::warning::npm trusted publishing needs a public repository, so the npm packages were built but not published."
