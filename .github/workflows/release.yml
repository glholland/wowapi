name: Release

# Push a version tag to release:
#   git tag v0.5.0 && git push origin v0.5.0
# Tags with a pre-release suffix (v0.6.0-rc.1) become GitHub pre-releases and
# are published to npm under the "next" dist-tag instead of "latest".
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe stamps the tag into the binaries

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Check the tag is a semver version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - name: Format, vet and test
        run: task check

      - name: Lint
        run: task lint

      - name: Vulnerability scan
        run: task vuln

      - name: Cross-compile
        run: task release

      - name: Checksums
        working-directory: dist
        run: sha256sum wowapi-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "wowapi $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build npm packages
        run: node npm/build.mjs --version "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash npm/publish.sh

      - name: npm publishing skipped
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN secret is not set, so the npm packages were built but not published."
