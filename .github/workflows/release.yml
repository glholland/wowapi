name: Release

# Normally triggered by release-please (see release-please.yml) when its
# release PR is merged. A tag can also be pushed by hand:
#   git tag v0.5.1 && git push origin v0.5.1
# Tags with a pre-release suffix (v0.6.0-rc.1) become GitHub pre-releases and
# are published to npm under the "next" dist-tag instead of "latest".
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The release tag to build, e.g. v0.6.0
        required: true
        type: string

permissions:
  contents: write # create or upload to the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # git describe stamps the tag into the binaries

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Check the tag is a semver version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - name: Format, vet and test
        run: task check

      - name: Lint
        run: task lint

      - name: Vulnerability scan
        run: task vuln

      - uses: actions/setup-node@v7 # the MCP bundle hooks run node
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Builds every platform, packs an MCP bundle per platform, writes
      # SHA256SUMS.txt and publishes the GitHub release. If release-please
      # already created the release, its notes are kept and assets are added.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      - name: Build npm packages
        run: node npm/build.mjs --version "${TAG#v}"

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash npm/publish.sh

      - name: npm publishing skipped
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN secret is not set, so the npm packages were built but not published."
