name: Release Please

# On every push to main, release-please keeps a "release PR" up to date with
# the next version and a CHANGELOG built from Conventional Commit messages.
# Merging that PR tags the release; this workflow then builds and publishes it
# by calling release.yml directly (a tag created with GITHUB_TOKEN does not
# trigger other workflows on its own).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # passed to release.yml for npm trusted publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A reusable workflow gets its token permissions from this calling job.
    permissions:
      contents: write
      id-token: write # npm trusted publishing
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
