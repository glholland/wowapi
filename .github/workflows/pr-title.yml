name: PR title

# PRs are squash-merged, so the PR title becomes the commit message on main.
# release-please reads those messages to pick the next version and write the
# changelog, so titles must follow Conventional Commits:
#   feat: ...   fix(mcp): ...   chore(deps)!: ...   (! marks a breaking change)
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add realm auctions tool' or 'fix(mcp): handle empty lists'. Got: $TITLE"
            exit 1
          fi
