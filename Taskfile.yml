# https://taskfile.dev
version: '3'

# Credentials and defaults live in .env (copy .env.example). Real environment
# variables take precedence over the file.
dotenv: ['.env']

vars:
  BIN: wowapi{{exeExt}}
  # Version stamped into builds: the nearest git tag, else the commit.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # Dev tools run via `go run`, so nothing needs installing first.
  GORELEASER: github.com/goreleaser/goreleaser/v2@v2.18.2
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@latest
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@latest
  INSPECTOR: '@modelcontextprotocol/inspector'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ---- Setup ---------------------------------------------------------------

  setup:
    desc: Create .env from the example and download Go modules
    cmds:
      - task: env
      - go mod download

  env:
    internal: true
    cmds:
      - cp .env.example .env
      - echo "Created .env - fill in BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET"
    status:
      - test -f .env

  # ---- Build ---------------------------------------------------------------

  build:
    desc: Build the wowapi binary for this machine
    sources: ['**/*.go', go.mod, go.sum]
    generates: ['{{.BIN}}']
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BIN}} .

  install:
    desc: Install wowapi into your Go bin directory
    cmds:
      - go install -ldflags "-X main.version={{.VERSION}}" .

  release:
    desc: Snapshot release with GoReleaser - every platform's binary and MCP bundle, into dist/ and build/mcpb/ (nothing is published)
    cmds:
      - go run {{.GORELEASER}} release --snapshot --clean

  release:check:
    desc: Validate .goreleaser.yaml
    cmds:
      - go run {{.GORELEASER}} check

  npm:pack:
    desc: 'Build the npm packages and tarballs from a snapshot release into npm/dist (e.g. task npm:pack NPM_VERSION=0.5.0)'
    vars:
      NPM_VERSION: '{{.NPM_VERSION | default "0.0.0-local"}}'
    cmds:
      - task: release
      - node npm/build.mjs --version {{.NPM_VERSION}}
      - cmd: cd npm/dist && for d in wowapi wowapi-*; do npm pack "./$d" --silent; done

  npm:bootstrap:
    desc: 'One time: build real npm packages from a GitHub release to create them on npm (e.g. task npm:bootstrap TAG=v0.5.0), then run task npm:publish'
    vars:
      TAG: '{{.TAG | default "v0.5.0"}}'
    cmds:
      - rm -rf build/bootstrap
      - gh release download {{.TAG}} --pattern "wowapi-v*" --dir build/bootstrap
      - node npm/build.mjs --version {{trimPrefix "v" .TAG}} --assets build/bootstrap
      - echo "Packages for {{.TAG}} are in npm/dist. Sign in with npm login, then run task npm:publish."

  npm:publish:
    desc: Publish the packages in npm/dist as the npm user you are signed in as (normally CI does this)
    preconditions:
      - sh: npm whoami
        msg: Sign in first with npm login
      - sh: test -f npm/dist/wowapi/package.json
        msg: Nothing to publish; run task npm:bootstrap (or task npm:pack) first
    cmds:
      - bash npm/publish.sh

  version:
    desc: Show the version builds will be stamped with, and the built binary's
    cmds:
      - echo "source {{.VERSION}}"
      - cmd: ./{{.BIN}} version
        ignore_error: true

  clean:
    desc: Remove build output, release artifacts and coverage files
    cmds:
      - go clean
      - rm -rf {{.BIN}} dist build npm/dist coverage.out .task

  # ---- Quality ---------------------------------------------------------------

  test:
    desc: Run the tests
    cmds:
      - go test ./...

  check:
    desc: Format check, vet and test (run before committing)
    cmds:
      - task: fmt:check
      - go vet ./...
      - task: test

  fmt:
    desc: Format the code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any file needs gofmt
    cmds:
      - 'test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)'

  lint:
    desc: Run staticcheck (downloaded on first use)
    cmds:
      - go run {{.STATICCHECK}} ./...

  vuln:
    desc: Check dependencies and code for known vulnerabilities (govulncheck)
    cmds:
      - go run {{.GOVULNCHECK}} ./...

  secrets:
    desc: Scan the whole git history for committed secrets (gitleaks)
    cmds:
      - go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose .

  cover:
    desc: Run tests with coverage and print per-function results
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  ci:
    desc: Everything CI should run - check, lint, vulnerability scan, release build
    cmds:
      - task: check
      - task: lint
      - task: vuln
      - task: release

  # ---- Dependencies ----------------------------------------------------------

  tidy:
    desc: Add missing and remove unused module requirements
    cmds:
      - go mod tidy

  deps:outdated:
    desc: List modules with newer versions available (shown in [brackets])
    cmds:
      - go list -u -m all

  deps:update:
    desc: Update all dependencies to their latest minor/patch versions, then re-check
    cmds:
      - go get -u ./...
      - go mod tidy
      - task: check

  # ---- Running ---------------------------------------------------------------

  run:
    desc: 'Run a CLI command, e.g. task run -- character -section equipment'
    deps: [build]
    cmds:
      - ./{{.BIN}} {{.CLI_ARGS}}

  character:
    desc: 'Show a character (defaults to WOW_REALM/WOW_CHARACTER), e.g. task character -- -section stats'
    deps: [build]
    cmds:
      - ./{{.BIN}} character {{.CLI_ARGS}}

  price:
    desc: 'Auction House commodity price, e.g. task price -- 240158'
    deps: [build]
    cmds:
      - ./{{.BIN}} price {{.CLI_ARGS}}

  # ---- MCP -------------------------------------------------------------------

  mcp:list:
    desc: List the MCP server's tools, resources and prompts (no credentials needed)
    deps: [build]
    cmds:
      - ./{{.BIN}} mcp -list

  mcp:inspect:
    desc: Open the MCP Inspector web UI against the built server (needs Node.js; reads .env)
    deps: [build]
    preconditions:
      - sh: command -v npx
        msg: The MCP Inspector needs Node.js (npx). Install it from https://nodejs.org
    cmds:
      - npx -y {{.INSPECTOR}} "{{.ROOT_DIR}}/{{.BIN}}" mcp

  mcp:add:
    desc: Register the built binary as a user-scoped MCP server in Claude Code (reads .env)
    deps: [build]
    preconditions:
      - sh: '[ -n "$BLIZZARD_CLIENT_ID" ] && [ -n "$BLIZZARD_CLIENT_SECRET" ]'
        msg: Set BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET in .env first (task setup)
    cmds:
      - >-
        claude mcp add wowapi --scope user
        -e "BLIZZARD_CLIENT_ID=$BLIZZARD_CLIENT_ID"
        -e "BLIZZARD_CLIENT_SECRET=$BLIZZARD_CLIENT_SECRET"
        -e "WOW_REGION=${WOW_REGION:-us}"
        -e "WOW_REALM=$WOW_REALM"
        -e "WOW_CHARACTER=$WOW_CHARACTER"
        -- "{{.ROOT_DIR}}/{{.BIN}}" mcp
